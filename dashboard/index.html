<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BellaBot Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header class="kopf">
        <div class="katze">
            <span class="ohr links"></span>
            <span class="ohr rechts"></span>
            <span class="gesicht">
                <span class="auge links"></span>
                <span class="auge rechts"></span>
                <span class="nase"></span>
            </span>
        </div>
        <h1>BellaBot Dashboard</h1>
    </header>

    <!-- Status-Kacheln -->
    <section class="kacheln">
        <div class="kachel">
            <div class="label">Akku</div>
            <div class="wert" id="akku">--</div>
        </div>
        <div class="kachel">
            <div class="label">Zustand</div>
            <div class="wert" id="zustand">--</div>
        </div>
        <div class="kachel">
            <div class="label">Aktuelle Aufgabe</div>
            <div class="wert" id="aufgabe">--</div>
        </div>
    </section>

    <!-- Steuerung -->
    <section class="steuerung">
        <h2>Steuerung</h2>
        <button id="btn-zurueck">Zurück zur Basis</button>
        <button id="btn-pause">Pause</button>
    </section>

    <!-- Punkte -->
    <section class="punkte">
        <h2>Punkte anfahren</h2>
        <div id="punkte-liste"></div>
    </section>

    <!-- Interaktive Karte -->
    <section class="karte">
        <h2>Karte</h2>
        <div id="karten-flaeche" class="karten-flaeche"></div>
    </section>

    <!-- Log -->
    <section class="log">
        <h2>Log</h2>
        <div id="log-liste"></div>
    </section>

    <script src="app.js"></script>
</body>
</html>
